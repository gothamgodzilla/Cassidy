[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mangasm-live-mix-voting"
version = "1.0.0"
description = "Wingman.OS Core automation for atomic Mangasm+ live mix voting"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
