# Wingman.OS Core distribution: API + optional local-LLM sidecar.
# Credentials ALWAYS come from the environment / secret store, never this file.
#   cp .env.example .env   # fill in SUPABASE_URL, SUPABASE_KEY, OZONE_HMAC_KEY
#   docker compose up --build            # API only
#   docker compose --profile llm up      # API + Ollama (llama3 / qwen)

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    profiles:
      - llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
